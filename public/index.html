<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RS Companion</title>
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#15130f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RS Companion">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c9a227'/><path d='M9 23 16 8l7 15' stroke='%231a1712' stroke-width='3.5' fill='none' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M9 23 16 8l7 15" stroke="var(--accent-text)" stroke-width="3.5" fill="none" stroke-linejoin="round"/></svg>
        <span class="brand-name">RS Companion</span>
      </div>
      <nav class="nav" aria-label="Main">
        <span class="nav-group">Progress</span>
        <a href="#/overview" data-route="overview">Overview</a>
        <a href="#/activity" data-route="activity">Activity</a>
        <a href="#/goals" data-route="goals">Goals</a>
        <a href="#/quests" data-route="quests">Quests &amp; diaries</a>
        <span class="nav-group">Combat</span>
        <a href="#/bossing" data-route="bossing">Bossing</a>
        <a href="#/slayer" data-route="slayer">Slayer</a>
        <span class="nav-group">Loot</span>
        <a href="#/drops" data-route="drops">Drops</a>
        <a href="#/collection" data-route="collection">Collection log</a>
        <a href="#/prices" data-route="prices">Prices</a>
        <span class="nav-group">Planning</span>
        <a href="#/timers" data-route="timers">Timers &amp; dailies</a>
        <a href="#/tasks" data-route="tasks">Tasks</a>
        <span class="nav-group"></span>
        <a href="#/settings" data-route="settings">Settings</a>
      </nav>
      <div class="player-card" id="player-card"></div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
